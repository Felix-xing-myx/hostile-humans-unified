plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '3.7.0'
group = 'dev.felix.hostilehumans'
base { archivesName = 'hostile-humans-unified-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
repositories { mavenCentral() }

def workspaceRootDir = file('../..')
def baselineModsDir = new File(workspaceRootDir, 'versions/Create-Delight-Remake/mods')
def legacyModsDir = new File(workspaceRootDir, '最初二创内容/mods')
// Public clones do not contain this maintenance workspace's modpack. Supply
// these API-only JARs with -PtaczApiJar=..., -PcuriosApiJar=..., and
// -PmaidApiJar=..., -PfirstAidApiJar=..., -PscgunsApiJar=...; local defaults preserve the workflow.
def taczApiJar = file(findProperty('taczApiJar') ?: new File(baselineModsDir, 'tacz-1.20.1-1.1.8-hotfix.jar'))
def curiosApiJar = file(findProperty('curiosApiJar') ?: new File(baselineModsDir, 'curios-forge-5.14.1+1.20.1.jar'))
def maidApiJar = file(findProperty('maidApiJar') ?: new File(legacyModsDir, '[车万女仆]touhoulittlemaid-1.5.3-modified-all.jar'))
def firstAidApiJar = file(findProperty('firstAidApiJar') ?: new File(workspaceRootDir, '../game/.minecraft/versions/1.20.1-Forge_47.4.21/mods/[急救／医疗护理] firstaid-1.20.1-1.1.jar'))
def scgunsApiJar = file(findProperty('scgunsApiJar') ?: new File(workspaceRootDir, '../game/.minecraft/versions/1.20.1-Forge_47.4.21/mods/ScorchedGuns-0.5.5-1.20.1.jar'))
[
        taczApiJar: taczApiJar,
        curiosApiJar: curiosApiJar,
        maidApiJar: maidApiJar,
        firstAidApiJar: firstAidApiJar,
        scgunsApiJar: scgunsApiJar
].each { label, apiJar ->
    if (!apiJar.isFile()) {
        throw new GradleException("Missing ${label} at ${apiJar}. Supply -P${label}=<path-to-jar>; see README.md.")
    }
}

dependencies {
    compileOnly files(curiosApiJar)
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(taczApiJar)
    // Create Delight Remake currently has no Touhou Little Maid. Keep the exact
    // legacy API JAR as a compile-only compatibility input; it is not packaged.
    compileOnly files(maidApiJar)
    // Public ItemHealing / AbstractPartHealer API only; never bundled or required at runtime.
    compileOnly files(firstAidApiJar)
    compileOnly files(scgunsApiJar)
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep other compiler diagnostics visible while silencing the legacy API
    // deprecation and for-removal notices in the maintained upstream code.
    options.compilerArgs += ['-Xmaxerrs', '300', '-Xlint:-deprecation', '-Xlint:-removal']
}
tasks.withType(JavaExec).configureEach {
    systemProperty "hhu.projectDir", projectDir.absolutePath
    def isolatedWorkingDir = file("$buildDir/javaexec/${name}")
    workingDir isolatedWorkingDir
    doFirst { isolatedWorkingDir.mkdirs() }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar).configure {
    manifest { attributes('Implementation-Version': project.version,
        'Implementation-Title': 'Hostile Humans Unified',
        'MixinConfigs': 'hostile_humans_unified.mixins.json,hostile_humans_unified.world.mixins.json') }
    finalizedBy 'reobfJar'
}
tasks.register('encounterPolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.EncounterCooldownTest'
}
tasks.register('runtimePoliciesTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.felix.hostilehumans.core.RuntimePoliciesTest'
}

tasks.register('performancePoliciesTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.felix.hostilehumans.core.PerformancePoliciesTest'
}

tasks.register('lootScreeningTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.LootScreeningTest'
}
tasks.named('check').configure {
    dependsOn tasks.named('encounterPolicyTest'), tasks.named('runtimePoliciesTest'), tasks.named('performancePoliciesTest')
}

tasks.register('optionalRuntimeTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.OptionalRuntimeTest'
    args sourceSets.main.output.classesDirs.singleFile.absolutePath
}
tasks.register('unifiedConfigTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.UnifiedConfigTest'
}
tasks.named('check').configure {
    dependsOn tasks.named('optionalRuntimeTest'), tasks.named('unifiedConfigTest')
}

tasks.register('structureCompatTest', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('reobfJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.craftix.hostile_humans.StructureCompatTest'
    def scratchDir = file("$buildDir/tmp/structure-compat")
    doFirst { scratchDir.mkdirs() }
    args tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath,
            scratchDir.absolutePath
}
tasks.named('check').configure { dependsOn tasks.named('structureCompatTest') }

tasks.register('recruitmentCombatTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.RecruitmentCombatTest'
}
tasks.named('check').configure { dependsOn tasks.named('recruitmentCombatTest') }

tasks.register('combatPressurePolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.CombatPressurePolicyTest'
}
tasks.named('check').configure { dependsOn tasks.named('combatPressurePolicyTest') }

tasks.register('betterCombatAnimationTimingTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.craftix.hostile_humans.client.renderer.BetterCombatAnimationTimingTest'
}
tasks.named('check').configure { dependsOn tasks.named('betterCombatAnimationTimingTest') }

tasks.register('rangedWeaponCustodyPolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.RangedWeaponCustodyPolicyTest'
}
tasks.named('check').configure { dependsOn tasks.named('rangedWeaponCustodyPolicyTest') }

tasks.register('soldierCombatModeTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.SoldierCombatModeTest'
}
tasks.named('check').configure { dependsOn tasks.named('soldierCombatModeTest') }

tasks.register('recruitmentTermsTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.RecruitmentTermsTest'
}
tasks.named('check').configure { dependsOn tasks.named('recruitmentTermsTest') }

tasks.register('pickupPolicyWiringTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.PickupPolicyWiringTest'
}
tasks.named('check').configure { dependsOn tasks.named('pickupPolicyWiringTest') }

tasks.register('defensiveBehaviorTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.DefensiveBehaviorTest'
}
tasks.named('check').configure { dependsOn tasks.named('defensiveBehaviorTest') }

// Regression checks for inventory custody, save codecs, and removed artifact entries.
tasks.register('maintenanceRefactorTest', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('reobfJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.MaintenanceRefactorTest'
    args tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
}

tasks.named('check').configure { dependsOn tasks.named('maintenanceRefactorTest') }

tasks.register('hostileBeaconFoodPolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.HostileBeaconFoodPolicyTest'
}

tasks.named('check').configure { dependsOn tasks.named('hostileBeaconFoodPolicyTest') }

tasks.register('taczAnimationPolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.craftix.hostile_humans.client.renderer.TaczAnimationPolicyTest'
}

tasks.named('check').configure { dependsOn tasks.named('taczAnimationPolicyTest') }

tasks.register('humanAmmoPolicyTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.HumanAmmoPolicyTest'
}

tasks.named('check').configure { dependsOn tasks.named('humanAmmoPolicyTest') }

['HumanArrowCombatTest', 'AmmoWeaponSelectionTest', 'ReloadPaymentLedgerTest', 'TierRuntimeConfigTest', 'HumanAmmoConfigSwitchTest', 'TierConfigFilesTest', 'SpawnPotionConfigTest', 'SoldierFollowPolicyTest', 'OfflineSoldierDeathReportsTest', 'GunCombatPolicyTest', 'SupplyAndCloseDefenseTest', 'PotionRecoveryTest', 'BodyguardAndVanillaModeTest', 'InteractionSafetyPolicyTest', 'TntEscapeSourceTest', 'SupplyConfigurationTest', 'MaidHumanRelationTest', 'HumanProjectileRelationsTest', 'ProjectileCooldownPolicyTest', 'CombatTerrainPolicyTest', 'RangedTerrainSafetyTest', 'PursuitNavigationTest'].each { testClass ->
    def taskName = testClass.substring(0, 1).toLowerCase() + testClass.substring(1)
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'club.someoneice.humangunner.' + testClass
        if (testClass == 'HumanProjectileRelationsTest') args taczApiJar.absolutePath
        if (testClass == 'TntEscapeSourceTest') {
            args file('src/main/java/com/craftix/hostile_humans/entity/ai/goal/AvoidTNTGoal.java').absolutePath
        }
    }
    tasks.named('check').configure { dependsOn tasks.named(taskName) }
}

tasks.register('taczAmmoMixinContractTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.TaczAmmoMixinContractTest'
    args taczApiJar.absolutePath
}
tasks.named('check').configure { dependsOn tasks.named('taczAmmoMixinContractTest') }

tasks.register('unifiedNamespaceTest', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('reobfJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'club.someoneice.humangunner.UnifiedNamespaceTest'
    args tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
}
tasks.named('check').configure { dependsOn tasks.named('unifiedNamespaceTest') }

// Explicit maintenance action; never runs during build/check.
tasks.register('sanitizeStructureWaystones', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.craftix.hostile_humans.StructureWaystoneSanitizer'
    args file('src/main/resources').absolutePath
    if (project.hasProperty('applyStructureRepair')) args '--apply'
}
