// Native monitor modules: deterministic intent, collision bridges, visual clock and actual injection seams.
def monitorMinecraftJar = {
    def candidate = sourceSets.test.runtimeClasspath.files.find { entry ->
        entry.isFile() && entry.name.endsWith('.jar') && new java.util.zip.ZipFile(entry).withCloseable { archive ->
            archive.getEntry('net/minecraft/world/entity/Entity.class') != null
        }
    }
    if (candidate == null) throw new GradleException('Mapped Minecraft runtime JAR is required for monitor bytecode contracts')
    candidate.absolutePath
}
