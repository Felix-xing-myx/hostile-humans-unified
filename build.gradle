    mainClass = 'dev.felix.hostilehumans.compat.VanillaMixinTargetsTest'
    doFirst {
        def nativeJar = file(findProperty('minecraftSrgJar') ?: new File(gradle.gradleUserHomeDir,
            "caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-srg.jar"))
        if (!nativeJar.isFile()) throw new GradleException('SRG Forge Minecraft JAR required; supply -PminecraftSrgJar=...')
        setArgs([nativeJar.absolutePath, tasks.named('jar').get().archiveFile.get().asFile.absolutePath])
    }
}
tasks.named('check').configure { dependsOn tasks.named('vanillaMixinArtifactTest') }
