// Execute actual dependency contracts without launching the game or copying runtime APIs into source.
tasks.register('nativeRecoilApiContractTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = testEntrypoint('NativeRecoilApiContractTest')
    doFirst {
        def runtimeApi = file(findProperty('taczRuntimeJar') ?: taczApiJar)
        def math = file("$buildDir/runtime-contracts/commons-math3.jar")
        math.parentFile.mkdirs()
        new java.util.zip.ZipFile(runtimeApi).withCloseable { zip ->
            def nested = zip.entries().find { it.name.endsWith('.jar') && it.name.contains('commons-math3') }
            if (nested == null) throw new GradleException('TaCZ native recoil math library not found: ' + runtimeApi)
            zip.getInputStream(nested).withCloseable { input -> math.withOutputStream { output -> output << input } }
        }
        setArgs([runtimeApi.absolutePath, math.absolutePath])
    }
}
tasks.named('check').configure { dependsOn tasks.named('nativeRecoilApiContractTest') }
